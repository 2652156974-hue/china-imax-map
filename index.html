<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>中国 IMAX 银幕地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root{
      --bg:#f3f4f6;
      --panel:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --soft:#f9fafb;
      --shadow:0 14px 40px rgba(17,24,39,.14);
      --accent:#111827;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#0b0d10;
        --panel:#15181d;
        --text:#f3f4f6;
        --muted:#9ca3af;
        --line:#2b3037;
        --soft:#1d2127;
        --shadow:0 18px 48px rgba(0,0,0,.42);
        --accent:#f9fafb;
      }
    }
    *{box-sizing:border-box}
    html,body,#map{height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow:hidden;
    }
    #map{background:var(--bg)}
    .panel{
      position:absolute;
      z-index:1000;
      top:max(16px,env(safe-area-inset-top));
      left:max(16px,env(safe-area-inset-left));
      width:min(420px,calc(100vw - 32px));
      background:color-mix(in srgb,var(--panel) 96%,transparent);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:16px;
    }
    .title-row{display:flex;align-items:center;gap:9px;margin-bottom:4px}
    h1{font-size:19px;line-height:1.25;margin:0;font-weight:800;letter-spacing:-.02em}
    .version{font-size:10px;font-weight:800;line-height:1;border:1px solid var(--line);border-radius:999px;padding:5px 7px;color:var(--muted);background:var(--soft)}
    .source-line{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 11px}
    .source-line a{color:inherit;text-decoration-thickness:1px;text-underline-offset:2px}
    .data-banner{font-size:11px;line-height:1.45;color:#075985;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:8px 10px;margin-bottom:11px}
    @media (prefers-color-scheme:dark){.data-banner{color:#bae6fd;background:#0c2938;border-color:#164e63}}
    .filters{display:flex;gap:7px;flex-wrap:wrap}
    .filter-label{font-size:10px;font-weight:800;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.06em}
    .filters button{
      appearance:none;
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      border-radius:999px;
      padding:7px 11px;
      cursor:pointer;
      font:inherit;
      font-size:12px;
      font-weight:700;
      transition:background .12s ease,border-color .12s ease,color .12s ease;
    }
    .filters button:hover{border-color:#9ca3af}
    .filters button.active{background:var(--accent);border-color:var(--accent);color:var(--bg)}
    .search-wrap{position:relative;margin-top:10px}
    .search-wrap::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-53%);font-size:18px;color:var(--muted);pointer-events:none}
    input{
      width:100%;
      border:1px solid var(--line);
      background:var(--soft);
      color:var(--text);
      border-radius:12px;
      padding:10px 12px 10px 34px;
      outline:none;
      font:inherit;
      font-size:13px;
    }
    input:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(107,114,128,.12)}
    .meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
    .status{font-size:12px;color:var(--muted)}
    .coverage{font-size:10px;color:var(--muted);white-space:nowrap}
    .record-list{margin-top:10px;max-height:190px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .record-item{padding:8px 2px;border-bottom:1px solid var(--line);font-size:11px;line-height:1.35}
    .record-item:last-child{border-bottom:0}
    .record-name{font-weight:800;color:var(--text)}
    .record-meta{color:var(--muted);margin-top:2px}
    .record-more{padding:8px 2px;font-size:10px;color:var(--muted)}
    .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .dot{width:8px;height:8px;border-radius:50%}
    .gt-bg{background:#b91c1c}.cola-bg{background:#7c3aed}.xt-bg{background:#2563eb}.xenon-bg{background:#4b5563}.unknown-bg{background:#9ca3af}.dome-bg{background:#c2410c}
    .imax-marker{
      display:flex;
      align-items:center;
      justify-content:center;
      border:2px solid rgba(255,255,255,.96);
      border-radius:50%;
      box-shadow:0 4px 13px rgba(0,0,0,.28);
      color:white;
      font-weight:850;
      font-size:10px;
      letter-spacing:-.02em;
    }
    .gt{background:#b91c1c}.cola{background:#7c3aed}.xt{background:#2563eb}.xenon{background:#4b5563}.unknown{background:#9ca3af}.dome{background:#c2410c}
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}
    .leaflet-popup-content-wrapper{border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
    .popup-title{font-weight:800;font-size:14px;line-height:1.4;margin-bottom:7px}
    .popup-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;line-height:1.35}
    .popup-grid b{font-weight:700;color:var(--muted)}
    .popup-note{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:11px;line-height:1.4;color:var(--muted)}
    .leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.82)!important}
    @media(max-width:640px){
      .panel{
        top:max(10px,env(safe-area-inset-top));
        left:10px;
        width:calc(100vw - 20px);
        border-radius:16px;
        padding:13px;
      }
      h1{font-size:17px}
      .source-line{font-size:11px;margin-bottom:9px}
      .data-banner{padding:7px 9px;margin-bottom:9px}
      .filters{gap:6px}
      .filters button{padding:6px 10px}
      .coverage{display:none}
      .legend{gap:8px}
    }
  </style>
</head>
<body>
  <div id="map" aria-label="中国 IMAX 影院地图"></div>

  <section class="panel" aria-label="地图筛选面板">
    <div class="title-row">
      <h1>中国 IMAX 银幕地图</h1>
      <span class="version">v0.3</span>
    </div>
    <p class="source-line">
      数据来源：<a href="https://weibo.com/6729835778" target="_blank" rel="noopener">@ArvinTingcn</a>
      《<a href="https://docs.qq.com/sheet/DQ3FEUUZJdklNSWJP?tab=BB08J2" target="_blank" rel="noopener">全球 IMAX 及特效影厅分布</a>》 · 已获授权
    </p>
    <div class="data-banner" id="dataBanner">正在加载已审计的 IMAX中国派生数据；没有可靠坐标的记录不会被放置到地图上。</div>

    <div class="filter-label">投影系统</div>
    <div class="filters" id="systemFilters" aria-label="放映系统筛选">
      <button class="active" data-system="ALL">全部</button>
      <button data-system="GT Laser">GT Laser</button>
      <button data-system="Commercial Laser">Commercial Laser</button>
      <button data-system="Laser XT">Laser XT</button>
      <button data-system="Xenon">Xenon</button>
      <button data-dome="true">Dome</button>
      <button data-system="unknown">Unknown</button>
    </div>

    <div class="filter-label">地区</div>
    <div class="filters" id="regionFilters" aria-label="地区筛选">
      <button class="active" data-region="ALL">全部地区</button>
      <button data-region="中国大陆">中国大陆</button>
      <button data-region="香港">香港</button>
      <button data-region="澳门">澳门</button>
      <button data-region="台湾">台湾</button>
    </div>

    <div class="filter-label">状态与声道</div>
    <div class="filters" id="statusFilters" aria-label="营业状态筛选">
      <button class="active" data-status="ALL">全部状态</button>
      <button data-status="open">营业</button>
      <button data-status="closed">已关闭</button>
      <button data-status="temporarily_closed">暂时停业</button>
      <button data-status="unknown">状态待核</button>
      <button data-audio="12">12声道</button>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索城市、地区或影院" autocomplete="off" />
    </div>

    <div class="meta-row">
      <div class="status" id="status">加载中…</div>
      <div class="coverage">覆盖目标：中国大陆 · 香港 · 澳门 · 台湾</div>
    </div>
    <div class="record-list" id="recordList" aria-label="筛选后的影院记录"></div>

    <div class="legend" aria-label="图例">
      <span><i class="dot gt-bg"></i>GT Laser</span>
      <span><i class="dot cola-bg"></i>Commercial Laser</span>
      <span><i class="dot xt-bg"></i>Laser XT</span>
      <span><i class="dot xenon-bg"></i>Xenon</span>
      <span><i class="dot unknown-bg"></i>Unknown</span>
      <span><i class="dot dome-bg"></i>Dome标记独立</span>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const map=L.map('map',{
      zoomControl:false,
      minZoom:3,
      worldCopyJump:true,
      preferCanvas:true,
      zoomSnap:.25
    }).setView([34.7,106.5],4.25);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      subdomains:'abc',
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    L.control.zoom({position:'bottomright'}).addTo(map);

    let cinemas=[];
    let activeSystem='ALL';
    let activeRegion='ALL';
    let activeStatus='ALL';
    let activeAudio=false;
    let activeDome=false;
    const markerLayer=L.markerClusterGroup ? L.markerClusterGroup({showCoverageOnHover:false,removeOutsideVisibleBounds:true,maxClusterRadius:48}) : L.layerGroup();
    markerLayer.addTo(map);

    const systemClass=c=>{
      const system=c?.projection?.system;
      if(system==='GT Laser') return 'gt';
      if(system==='Commercial Laser') return 'cola';
      if(system==='Laser XT') return 'xt';
      if(system==='Xenon') return c?.projection?.dome?'dome':'xenon';
      return 'unknown';
    };
    const label=c=>{
      const system=c?.projection?.system;
      if(system==='GT Laser') return 'GT';
      if(system==='Commercial Laser') return 'CL';
      if(system==='Laser XT') return 'XT';
      if(system==='Xenon') return c?.projection?.dome?'D':'Xe';
      return '?';
    };
    const safe=v=>String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const valueOrPending=v=>(v===null||v===undefined||v==='')?'待核':safe(v);
    const hasCoordinate=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
    const numberOrPending=v=>Number.isFinite(Number(v))?safe(Number(v).toFixed(3).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1')):'待核';
    const statusLabel=s=>s==='open'?'营业':s==='closed'?'已关闭':s==='temporarily_closed'?'暂时停业':'待核';
    const systemLabel=c=>{
      const p=c?.projection||{};
      const parts=[];
      if(p.system&&p.system!=='unknown') parts.push(p.system);
      if(p.geometry) parts.push(p.geometry);
      if(p.dome) parts.push('Dome');
      if(p.plannedSystem) parts.push(`计划：${p.plannedSystem}`);
      return parts.length?parts.join(' · '):'待核';
    };

    function markerIcon(c){
      const area=Number(c?.screen?.area||0);
      const size=Math.max(27,Math.min(45,24+Math.sqrt(Math.max(area,1))));
      return L.divIcon({
        className:'',
        html:`<div class="imax-marker ${systemClass(c)}" style="width:${size}px;height:${size}px">${label(c)}</div>`,
        iconSize:[size,size],
        iconAnchor:[size/2,size/2]
      });
    }

    function popup(c){
      const p=c.projection||{};
      const s=c.screen||{};
      const size=(s.width!==null&&s.height!==null)?`${numberOrPending(s.width)} × ${numberOrPending(s.height)} m`:'待核';
      const rawScreen=[s.rawWidth,s.rawHeight,s.rawArea].filter(v=>String(v??'').trim()!=='').map(safe).join(' / ');
      const sourceUrl=c.source?.url||'https://docs.qq.com/sheet/DQ3FEUUZJdklNSWJP?tab=BB08J2';
      return `<div class="popup-title">${safe(c.name||'待核影院')}</div><div class="popup-grid">
        <b>地区</b><span>${valueOrPending(c.region)}${c.city?` · ${safe(c.city)}`:''}</span>
        <b>投影</b><span>${safe(systemLabel(c))}</span>
        <b>声道</b><span>${p.audioChannels===null?'待核':safe(`${p.audioChannels}声道`)}</span>
        <b>银幕</b><span>${size}</span>
        <b>面积</b><span>${s.area===null?'待核':`${numberOrPending(s.area)} m²`}</span>
        <b>座位</b><span>${c.seats===null?'待核':safe(c.seats)}</span>
        <b>状态</b><span>${statusLabel(c.status)}</span>
      </div>${rawScreen?`<div class="popup-note">源表尺寸文本：${rawScreen}</div>`:''}${c.formerNames?.length?`<div class="popup-note">曾用名：${safe(c.formerNames.join('；'))}</div>`:''}<div class="popup-note">数据来源：<a href="${safe(sourceUrl)}" target="_blank" rel="noopener">@ArvinTingcn《全球 IMAX 及特效影厅分布》</a></div>`;
    }

    function render(){
      markerLayer.clearLayers();

      const q=document.querySelector('#search').value.trim().toLowerCase();
      const shown=cinemas.filter(c=>{
        const systemMatch=activeSystem==='ALL'||(c.projection?.system||'unknown')===activeSystem;
        const regionMatch=activeRegion==='ALL'||c.region===activeRegion;
        const domeMatch=!activeDome||c.projection?.dome===true;
        const statusMatch=activeStatus==='ALL'||c.status===activeStatus;
        const audioMatch=!activeAudio||c.projection?.audioChannels===12;
        const haystack=`${c.name||''} ${c.formerNames?.join(' ')||''} ${c.city||''} ${c.province||''} ${c.region||''} ${c.projection?.raw||''}`.toLowerCase();
        return systemMatch&&regionMatch&&domeMatch&&statusMatch&&audioMatch&&(!q||haystack.includes(q));
      });

      let located=0;
      shown.forEach(c=>{
        const lat=Number(c.location?.lat),lng=Number(c.location?.lng);
        if(!hasCoordinate(c.location?.lat)||!hasCoordinate(c.location?.lng)) return;
        located+=1;
        L.marker([lat,lng],{icon:markerIcon(c),title:c.name||''}).bindPopup(popup(c),{maxWidth:340}).addTo(markerLayer);
      });

      const pending=shown.length-located;
      document.querySelector('#status').textContent=`显示 ${located} 个地图点位 / ${shown.length} 条筛选记录 · ${pending} 条待定位`;
      const listItems=shown.slice(0,12).map(c=>{
        const location=[c.region,c.city].filter(Boolean).join(' · ')||'地区待核';
        const point=hasCoordinate(c.location?.lat)&&hasCoordinate(c.location?.lng)?'已定位':'待定位';
        return `<div class="record-item"><div class="record-name">${safe(c.name||'待核影院')}</div><div class="record-meta">${safe(location)} · ${safe(systemLabel(c))} · ${statusLabel(c.status)} · ${point}</div></div>`;
      }).join('');
      const more=shown.length>12?`<div class="record-more">其余 ${shown.length-12} 条记录可通过搜索或筛选查看。</div>`:'';
      document.querySelector('#recordList').innerHTML=listItems+more;
    }

    document.querySelector('#systemFilters').addEventListener('click',e=>{
      const button=e.target.closest('button[data-system],button[data-dome]');
      if(!button) return;
      if(button.dataset.system){
        document.querySelectorAll('#systemFilters button[data-system]').forEach(b=>b.classList.remove('active'));
        button.classList.add('active');
        activeSystem=button.dataset.system;
      }else if(button.dataset.dome){
        activeDome=!activeDome;
        button.classList.toggle('active',activeDome);
      }
      render();
    });

    document.querySelector('#regionFilters').addEventListener('click',e=>{
      const button=e.target.closest('button[data-region]');
      if(!button) return;
      document.querySelectorAll('#regionFilters button').forEach(b=>b.classList.remove('active'));
      button.classList.add('active');
      activeRegion=button.dataset.region;
      render();
    });

    document.querySelector('#statusFilters').addEventListener('click',e=>{
      const button=e.target.closest('button[data-status],button[data-audio]');
      if(!button) return;
      if(button.dataset.status){
        document.querySelectorAll('#statusFilters button[data-status]').forEach(b=>b.classList.remove('active'));
        button.classList.add('active');
        activeStatus=button.dataset.status;
      }else if(button.dataset.audio){
        activeAudio=!activeAudio;
        button.classList.toggle('active',activeAudio);
      }
      render();
    });

    document.querySelector('#search').addEventListener('input',render);

    fetch('./data/derived/cinemas.json')
      .then(r=>{if(!r.ok) throw new Error(`HTTP ${r.status}`);return r.json()})
      .then(data=>{
        if(!data||!Array.isArray(data.records)) throw new Error('派生数据格式错误');
        cinemas=data.records;
        const located=cinemas.filter(c=>hasCoordinate(c.location?.lat)&&hasCoordinate(c.location?.lng)).length;
        document.querySelector('#dataBanner').textContent=`已加载 ${cinemas.length} 条 IMAX中国派生记录；${located} 条有可靠坐标，${cinemas.length-located} 条待定位。多值尺寸与不确定字段仍显示“待核”。`;
        render();
      })
      .catch(err=>{
        document.querySelector('#status').textContent=`数据加载失败：${err.message}`;
      });
  </script>
</body>
</html>
