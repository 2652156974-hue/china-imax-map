<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./focus-navigation.css" />
  <title>中国 IMAX 银幕地图 · 高德公开版</title>
</head>
<body>
  <div id="map" aria-label="中国 IMAX 影院高德地图"></div>

  <section class="panel" aria-label="地图筛选面板">
    <div class="title-row">
      <h1>中国 IMAX 银幕地图</h1>
      <span class="version">AMap JS API 2.0</span>
    </div>
    <p class="source-line">
      数据来源：<a href="https://weibo.com/6729835778" target="_blank" rel="noopener">@ArvinTingcn</a>
      《<a href="https://docs.qq.com/sheet/DQ3FEUUZJdklNSWJP?tab=BB08J2" target="_blank" rel="noopener">全球 IMAX 及特效影厅分布</a>》
    </p>
    <div class="data-banner" id="dataBanner">正在加载公开事实层和高德运行时点位…</div>

    <details class="filter-details" open>
      <summary>筛选与搜索</summary>
      <div class="filter-label">投影系统</div>
      <div class="filters" id="systemFilters" aria-label="放映系统筛选">
        <button class="active" data-system="ALL">全部</button>
        <button data-system="GT Laser">GT Laser</button>
        <button data-system="Commercial Laser">Commercial Laser</button>
        <button data-system="Laser XT">Laser XT</button>
        <button data-system="Xenon">Xenon</button>
        <button data-dome="true">Dome</button>
        <button data-system="unknown">Unknown</button>
      </div>
      <div class="filter-label">地区</div>
      <div class="filters" id="regionFilters" aria-label="地区筛选">
        <button class="active" data-region="ALL">全部地区</button>
        <button data-region="中国大陆">中国大陆</button>
        <button data-region="香港">香港</button>
        <button data-region="澳门">澳门</button>
        <button data-region="台湾">台湾</button>
      </div>
      <div class="filter-label">状态与声道</div>
      <div class="filters" id="statusFilters" aria-label="营业状态筛选">
        <button class="active" data-status="ALL">全部状态</button>
        <button data-status="open">营业</button>
        <button data-status="closed">已关闭</button>
        <button data-status="temporarily_closed">暂时停业</button>
        <button data-status="unknown">状态待核</button>
        <button data-audio="12">12声道</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="搜索影院、曾用名、城市、商场或场馆" autocomplete="off" />
      </div>
      <div class="nearby-actions" aria-label="附近 IMAX 操作">
        <button class="nearby-button" id="nearbyButton" type="button">我的位置</button>
        <button class="nearby-exit" id="exitNearbyButton" type="button" hidden>× 退出附近</button>
      </div>
      <div class="nearby-status" id="nearbyStatus" role="status" aria-live="polite" hidden></div>
      <div class="nearby-toolbar" id="nearbyToolbar" hidden>
        <div class="nearby-scope" id="nearbyScope"></div>
        <div class="nearby-sort" id="nearbySortFilters" aria-label="附近排序">
          <button class="active" data-nearby-sort="distance" type="button">距离</button>
          <button data-nearby-sort="screen" type="button">银幕大小</button>
          <button data-nearby-sort="spec" type="button">综合规格</button>
        </div>
        <button class="nearby-expand" id="expandNearbyButton" type="button" hidden>扩大范围</button>
      </div>
    </details>

    <div class="meta-row">
      <div class="status" id="status">加载中…</div>
      <div class="coverage">高德 GCJ‑02 · 公开运行时 marker</div>
    </div>
    <div class="record-list" id="recordList" aria-label="筛选后的影院记录"></div>
    <div class="legend" aria-label="图例">
      <span><i class="dot gt-bg"></i>GT Laser</span>
      <span><i class="dot cola-bg"></i>Commercial Laser</span>
      <span><i class="dot xt-bg"></i>Laser XT</span>
      <span><i class="dot xenon-bg"></i>Xenon</span>
      <span><i class="dot dome-bg"></i>Dome</span>
      <span><i class="dot unknown-bg"></i>Unknown</span>
    </div>
  </section>

  <aside class="detail-panel" id="detailPanel" aria-label="影院详情" hidden>
    <button class="detail-close" id="detailClose" aria-label="关闭影院详情">×</button>
    <div id="detailContent"></div>
  </aside>
  <div class="map-error" id="mapError" role="status" aria-live="polite" hidden></div>

  <script src="./runtime-config.js"></script>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
